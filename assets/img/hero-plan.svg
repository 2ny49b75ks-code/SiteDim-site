<svg class="plan" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" fill="none">
  <!-- room outline (L-shape) -->
  <path d="M60 90 L300 90 L300 220 L360 220 L360 360 L60 360 Z"
        stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" fill="rgba(255,255,255,0.03)"/>

  <!-- capture corner markers -->
  <g stroke="#FA731C" stroke-width="2.5" stroke-linecap="round">
    <path d="M60 90 l0 16 M60 90 l16 0"/>
    <path d="M300 90 l0 16 M300 90 l-16 0"/>
    <path d="M300 220 l0 -16 M300 220 l16 0"/>
    <path d="M360 220 l0 16 M360 220 l-16 0"/>
    <path d="M360 360 l0 -16 M360 360 l-16 0"/>
    <path d="M60 360 l0 -16 M60 360 l16 0"/>
  </g>

  <!-- dimension line top -->
  <line x1="60" y1="60" x2="300" y2="60" stroke="#FA731C" stroke-width="1.5"/>
  <line x1="60" y1="52" x2="60" y2="68" stroke="#FA731C" stroke-width="1.5"/>
  <line x1="300" y1="52" x2="300" y2="68" stroke="#FA731C" stroke-width="1.5"/>
  <text x="180" y="46" fill="#FA731C" font-family="IBM Plex Mono, monospace" font-size="14" text-anchor="middle">7.32 m</text>

  <!-- dimension line left -->
  <line x1="32" y1="90" x2="32" y2="360" stroke="#FA731C" stroke-width="1.5"/>
  <line x1="24" y1="90" x2="40" y2="90" stroke="#FA731C" stroke-width="1.5"/>
  <line x1="24" y1="360" x2="40" y2="360" stroke="#FA731C" stroke-width="1.5"/>
  <text x="32" y="228" fill="#FA731C" font-family="IBM Plex Mono, monospace" font-size="14" text-anchor="middle" transform="rotate(-90 32 228)">8.85 m</text>

  <!-- diagonal trace line (AR path) -->
  <path d="M60 90 L300 90 L300 220 L360 220 L360 360 L60 360 L60 90"
        stroke="#FFFFFF" stroke-width="1" stroke-dasharray="3 6" opacity="0.5"/>

  <!-- AR capture reticles -->
  <g fill="#FFFFFF">
    <circle cx="60" cy="90" r="4"/>
    <circle cx="300" cy="90" r="4"/>
    <circle cx="300" cy="220" r="4"/>
    <circle cx="360" cy="220" r="4"/>
    <circle cx="360" cy="360" r="4"/>
    <circle cx="60" cy="360" r="4"/>
  </g>

  <!-- area readout -->
  <g>
    <rect x="120" y="255" width="150" height="66" rx="6" fill="#141F33" stroke="#FA731C" stroke-width="1.5"/>
    <text x="195" y="280" fill="rgba(255,255,255,0.55)" font-family="IBM Plex Mono, monospace" font-size="10" text-anchor="middle" letter-spacing="1.5">SUPERFICIE</text>
    <text x="195" y="305" fill="#FFFFFF" font-family="IBM Plex Mono, monospace" font-size="20" text-anchor="middle">55.4 m²</text>
  </g>

  <!-- ruler footer -->
  <g>
    <rect x="60" y="400" width="300" height="14" fill="#FFFFFF"/>
    <path d="M60 400 L74 414 M84 400 L98 414 M108 400 L122 414 M132 400 L146 414 M156 400 L170 414 M180 400 L194 414 M204 400 L218 414 M228 400 L242 414 M252 400 L266 414 M276 400 L290 414 M300 400 L314 414 M324 400 L338 414 M348 400 L360 411"
          stroke="#FA731C" stroke-width="3"/>
    <rect x="60" y="400" width="300" height="14" fill="none" stroke="#FA731C" stroke-width="2"/>
  </g>
</svg>
